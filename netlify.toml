[build]
  command = "pnpm payload migrate && pnpm build"

# Junk/scanner paths answered from the CDN. Wildcards only work as a trailing segment (no /*.php or /.env.*).

# WordPress / PHP
[[redirects]]
  from = "/wp-admin"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-json/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-config.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/index.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404
  force = true

